<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 380px;
      background: #fff;
      padding: 30px;
      border: 1px solid #ddd;
    }

    h2 {
      margin-bottom: 5px;
    }

    .sub {
      font-size: 13px;
      color: gray;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    .small-btn {
      background: #eee;
      color: black;
    }

    .links {
      margin-top: 15px;
      font-size: 12px;
      text-align: center;
      color: gray;
    }

    .links span {
      margin: 0 5px;
      cursor: pointer;
    }

    .divider {
      margin: 20px 0;
      text-align: center;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <h2>로그인/회원가입</h2>
  <div class="sub">통합계정으로 로그인하세요.</div>

  <input type="text" placeholder="통합계정 또는 이메일">
  <input type="password" placeholder="비밀번호">

  <input id="id">
  <input id="pw">
  <button id="loginBtn">로그인</button>

  <label style="font-size:12px;">
    <input type="checkbox"> 자동 로그인
  </label>

  <button>로그인</button>

  <div class="divider">또는</div>

  <button class="small-btn">카카오로 시작하기</button>
  <button class="small-btn">Apple로 시작하기</button>

  <div class="links">
    <span>아이디 찾기</span> |
    <span>비밀번호 찾기</span>
  </div>

  <div class="divider">회원가입</div>
  <a href="register.html">회원가입</a>

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/login.js"></script>

</body>
</html>
